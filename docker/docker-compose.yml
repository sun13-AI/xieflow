# XieFlow r21 - private deployment (docker-compose).
# Usage: cd docker && docker compose up -d
# Web+api on http://127.0.0.1:8080 ; SQLite in the named volume xieflow-data.
services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      XIEFLOW_MODE: remote
      XIEFLOW_PORT: 8080
      XIEFLOW_API_PORT: 8787
      XIEFLOW_DB_PATH: /app/data/xieflow.db
    ports:
      - 8080:8080
    volumes:
      - xieflow-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  xieflow-data:

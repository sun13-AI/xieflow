name: CI
on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:all
      - name: HTTP smoke (linux only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          pnpm dev:api &
          sleep 4
          curl -fsS http://127.0.0.1:8787/api/health | grep -q '"ok":true'
          curl -fsS http://127.0.0.1:8787/api/health | grep -q '"schemaVersion":2'

  release:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build bundle
        run: pnpm install && pnpm run build
      - name: Pack artifact
        run: |
          mkdir -p release
          tar -czf release/xieflow-${{ github.ref_name }}.tar.gz \
            --exclude node_modules \
            --exclude data \
            .
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.tar.gz
